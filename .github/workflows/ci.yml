name: CI - Build MRR Charts

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run analysis & verify images
        run: |
          python analysis.py
          test -f images/mrr_line_vs_target.png
          test -f images/mrr_bars_vs_target.png
